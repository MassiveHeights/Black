    // Builds the category sidebar from manifest.js.
    function buildSidebar() {
      let html = '<ul class="black-list">';

      for (const group in window.EXAMPLES) {
        html += `<li class="black-list-item" data-id="${group}">${group}`;
        html += '<ul class="black-list-sub">';

        for (const example of window.EXAMPLES[group]) {
          const query = `?group=${encodeURIComponent(group)}&example=${encodeURIComponent(example + '.js')}`;
          html += `<li class="black-list-item-sub"><a href="${query}">${example}</a></li>`;
        }

        html += '</ul></li>';
      }

      document.getElementById('left').innerHTML = html + '</ul>';
    }

    function loadBlack(cb) {
      var script = document.createElement('script');
      script.src = SITE_ROOT + '/dist/black-engine.js';
      script.onload = function (e) {
        for (const key in window['black-engine']) {
          window[key] = window['black-engine'][key];
        }

        // Examples reference assets by root-absolute path ('/assets/...'), which
        // breaks whenever the site is not served from a domain root. AssetManager
        // prepends defaultPath to every enqueued URL, so rebasing it here keeps
        // all example sources working unmodified at any deploy path.
        const BaseAssetManager = window.AssetManager;
        window.AssetManager = class extends BaseAssetManager {
          constructor(...args) {
            super(...args);
            this.mDefaultPath = SITE_ROOT;
          }

          get defaultPath() {
            return this.mDefaultPath;
          }

          // Some examples set defaultPath themselves. Keep those rooted at the
          // deploy path too, instead of letting them clobber the rebase.
          set defaultPath(value) {
            this.mDefaultPath = value.startsWith('/') ? SITE_ROOT + value : value;
          }
        };

        cb();
      };
      document.head.appendChild(script);
    }

    function boot() {
      let group = getParameterByName('group');
      let example = getParameterByName('example');

      activeGroup = group;
      activeExample = example;

      //let fsbtn = document.getElementById('fs')
      let url = window.location.href + '&fs=1';
      document.getElementById('fs').href = url;

      if (group != null && example != null) {
        var script = document.createElement('script');
        script.src = `${encodeURIComponent(group)}/${encodeURIComponent(example)}`;
        script.onload = function (e) { };
        document.head.appendChild(script);
      } else {
        document.getElementById('right').style.display = 'none';
      }

      let fs = getParameterByName('fs');
      if (fs) {
        document.getElementById('left').style.display = 'none';
        let rs = document.getElementById('right').style;
        let gcs = document.getElementById('game-container').style;
        let gcw = document.getElementById('game-container-wrapper').style;

        document.getElementById('btn-fs').style.display = 'none';

        rs.width = '100%';
        rs.height = '100%';
        rs.boxShadow = '';
        rs.borderRadius = 0;
        rs.padding = 0;
        rs.margin = 0;
        rs.left = 0;

        gcs.width = '100%';
        gcs.height = '100%';

        gcw.width = '100%';
        gcw.height = '100%';
      }

      SplashScreen.enabled = false;

      let elements = document.querySelectorAll('#left a');
      for (let i = 0; i < elements.length; i++) {
        const el = elements[i];

        let group = el.parentElement.parentElement.parentElement.getAttribute('data-id');
        let example = el.text + '.js';

        if (group === activeGroup && example === activeExample) {
          el.scrollIntoView({ behavior: 'instant' });
          el.style.fontWeight = 'bold';

          break;
        }
      }
    }

    document.addEventListener('keydown', (event) => {
      let elements = document.querySelectorAll('#left a');

      if (event.key === 'F5')
        return;

      if (event.key !== '[' && event.key !== ']')
        return;

      let dir = -1;
      if (event.key === '[')
        dir = -1;
      if (event.key === ']')
        dir = 1;

      let nextIx = 0;

      if (activeGroup === null && activeExample === null) {

      } else {
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];

          let group = el.parentElement.parentElement.parentElement.getAttribute('data-id');
          let example = el.text + '.js';

          if (group === activeGroup && example === activeExample) {

            nextIx = i + dir;
            if (nextIx >= elements.length)
              nextIx = 0;

            if (nextIx < 0)
              nextIx = elements.length - 1;
            break;
          }
        }
      }

      let group = elements[nextIx].parentElement.parentElement.parentElement.getAttribute('data-id');
      let example = elements[nextIx].text;

      let redirectTo = `${location.pathname}?group=${encodeURIComponent(group)}&example=${encodeURIComponent(example + '.js')}`;

      let fs = getParameterByName('fs');
      if (fs)
        redirectTo += '&fs=1';

      window.location.href = redirectTo;
    });

    document.addEventListener('DOMContentLoaded', x => {
      buildSidebar();
      loadBlack(boot);
    });

    (function () {
      var script = document.createElement('script');
      script.onload = function () {
        var stats = new Stats();

        if (document.getElementById('right')) {
          document.getElementById('right').appendChild(stats.dom);
          stats.dom.id = 'stats';
        }

        requestAnimationFrame(function loop() {
          stats.update();
          requestAnimationFrame(loop)
        });
      };
      //script.src = '//rawgit.com/mrdoob/stats.js/master/build/stats.min.js';
      //document.head.appendChild(script);
    })();
  </script>
</head>

<body>
  <div id="left" class="box"></div>
  <div id="right" class="box">
    <div id="game-container-wrapper">
      <div id="game-container" style="width: 900px; height: 500px;">
      </div>
    </div>

    <div id='btn-fs'>
      <a id='fs' href="/fs=1">FULLSCREEN</a>
    </div>
  </div>
</body>

</html>
